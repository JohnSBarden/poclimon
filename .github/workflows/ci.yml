name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # Every PR into develop records itself in CHANGELOG.md, so the develop → main
  # PR already carries the release notes. Label a PR `skip-changelog` for
  # changes players won't notice (CI, refactors, docs).
  changelog:
    name: CHANGELOG.md updated
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'develop' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA"...HEAD | grep -qx CHANGELOG.md; then
            echo "::error::Add a line under '## [Unreleased]' in CHANGELOG.md (or label the PR skip-changelog)"
            exit 1
          fi
