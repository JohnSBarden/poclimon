name: Release

# Runs when develop is merged into main. Feature work lands on develop first, so
# one merge to main ships everything collected under "## [Unreleased]" in
# CHANGELOG.md as a single release.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump version and publish
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          # Release only when the changelog has something to ship, so merging
          # CI/docs-only changes into main doesn't cut an empty release.
          UNRELEASED=$(awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' CHANGELOG.md \
                       | grep -E '^[[:space:]]*[-*]' || true)
          if [[ -z "$UNRELEASED" ]]; then
            echo "No entries under '## [Unreleased]' in CHANGELOG.md; skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                     --sort=-version:refname | head -1)
          [[ -z "$LAST_TAG" ]] && LAST_TAG=$(git rev-list --max-parents=0 HEAD)

          COMMITS=$(git log "${LAST_TAG}..HEAD" --format='%s')
          if [[ -z "$COMMITS" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          FULL_LOG=$(git log "${LAST_TAG}..HEAD" --format='%B')
          BUMP="patch"
          if echo "$FULL_LOG" | grep -qE 'BREAKING[[:space:]]CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?(!:|\:)'; then
            BUMP="minor"
          fi

          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION"     >> "$GITHUB_OUTPUT"
          echo "new_tag=v${NEW_VERSION}"      >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml
        if: steps.bump.outputs.skip != 'true'
        run: |
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${{ steps.bump.outputs.new_version }}\"/" Cargo.toml

      - name: Regenerate Cargo.lock
        if: steps.bump.outputs.skip != 'true'
        run: cargo generate-lockfile

      - name: Stamp CHANGELOG.md
        if: steps.bump.outputs.skip != 'true'
        run: |
          # Keep an empty Unreleased heading and move its entries under the new version.
          sed -i "0,/^## \[Unreleased\]$/s//## [Unreleased]\n\n## [${{ steps.bump.outputs.new_tag }}] - $(date -u +%Y-%m-%d)/" CHANGELOG.md

      - name: Commit, tag, push
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          # No [skip ci]: GitHub would also skip the tag push, and the tag is what
          # starts build-release.yml. This workflow re-runs on the release commit
          # and stops at the empty Unreleased section.
          git commit -m "chore(release): ${{ steps.bump.outputs.new_tag }}"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Sync develop with the release commit
        if: steps.bump.outputs.skip != 'true'
        run: |
          # Fast-forward only. If develop moved during the release, merge main
          # into develop by hand before the next feature PR.
          git push origin main:develop \
            || echo "::warning::develop is not an ancestor of main; merge main into develop manually"

      - name: Publish to crates.io
        if: steps.bump.outputs.skip != 'true'
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
